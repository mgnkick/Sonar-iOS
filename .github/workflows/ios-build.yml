name: iOS build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: xcode-select -p
      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project WiFiSonar.xcodeproj \
            -scheme WiFiSonar \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build